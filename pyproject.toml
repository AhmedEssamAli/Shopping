[project]
name = "shopper"
version = "0.1.0"
description = "Personal price-comparison and basket agent for Egyptian shopping platforms"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "playwright==1.55.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
shopper = "shopper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
